name: Publish

# Publishes the workspace crates to crates.io in dependency order:
# dbt-yaml_derive, dbt-yaml_schemars_derive, then dbt-yaml.
#
# Trigger: push a tag named "v<version>" (for example "v0.10.4") after the
# version bump PR has merged, or run the workflow manually from the Actions
# tab. The tag must match the version in the Cargo.toml files. Reruns are
# safe: crates whose version is already uploaded are skipped.
#
# Requires a CARGO_REGISTRY_TOKEN secret that contains a crates.io API token
# with publish rights on all three crates. Alternatively, configure trusted
# publishing on crates.io for this repository and workflow, and remove the
# token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_REGISTRY_TOKEN: ${{secrets.CARGO_REGISTRY_TOKEN}}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates.io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify versions
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' dbt-yaml/Cargo.toml | cut -d'"' -f2)
          for crate in dbt-yaml_derive dbt-yaml_schemars_derive; do
            other=$(grep -m1 '^version = ' "$crate/Cargo.toml" | cut -d'"' -f2)
            if [[ $other != "$version" ]]; then
              echo "::error::Version mismatch: dbt-yaml is $version but $crate is $other"
              exit 1
            fi
          done
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match crate version $version"
            exit 1
          fi
          echo "Publishing version $version"

      - name: Publish crates
        shell: bash
        run: |
          set -euo pipefail
          for crate in dbt-yaml_derive dbt-yaml_schemars_derive dbt-yaml; do
            echo "::group::cargo publish -p $crate"
            published=false
            for attempt in $(seq 1 12); do
              if output=$(cargo publish -p "$crate" 2>&1); then
                echo "$output"
                published=true
                break
              fi
              echo "$output"
              if grep -q "already uploaded" <<<"$output"; then
                published=true
                break
              fi
              # A dependent crate can fail until the crates.io index picks up
              # the crates published before it. Retry with a delay.
              echo "Attempt $attempt failed; retrying in 15 seconds"
              sleep 15
            done
            echo "::endgroup::"
            if [[ $published == false ]]; then
              echo "::error::Failed to publish $crate"
              exit 1
            fi
          done
